# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Emanuele Petriglia
email: inbox@emanuelepetriglia.com
description: >- # this means to ignore newlines until "baseurl:"
  Emanuele Petriglia's personal website and blog.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.emanuelepetriglia.com" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings.
theme: jekyll-whiteglass
plugins:
  - jekyll-feed
  - jekyll-asciidoc
  - jekyll-archives
  - jekyll-paginate
  - jekyll-sitemap

# The following items will not be processed and copied to 'public'.
exclude:
    - Makefile
    - README.adoc
    - LICENSE
    - Gemfile
    - Gemfile.lock
    - vendor

permalink: /blog/:year/:month/:day/:title/

paginate_path: /posts/:num/
paginate: 5

# jekyll-asrchives configuration.
jekyll-archives:
  enabled:
   - categories
   - tags
  layout: category_archives
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# Do not use '_site', instead 'public' because of GitLab Pages.
destination: public

# jekyll-asciidoc configuration.
asciidoc: {}
asciidoctor:
  attributes:
    icons: font
